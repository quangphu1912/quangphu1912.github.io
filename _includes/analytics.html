<!-- Google Analytics 4 -->
{% if site.google_analytics %}
<script>
    // Honor the opt-out BEFORE gtag('config') - config sends the first page_view, so a flag set
    // afterwards would still leak one hit. localStorage can throw (private mode / blocked storage);
    // treat that as "not opted out".
    try {
        if (localStorage.getItem('analytics-opt-out') === 'true') {
            window['ga-disable-{{ site.google_analytics }}'] = true;
        }
    } catch (e) { /* storage unavailable */ }

    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    // Privacy-respecting configuration
    gtag('config', '{{ site.google_analytics }}', {
        'cookie_flags': 'SameSite=None;Secure'
    });
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
{% endif %}
